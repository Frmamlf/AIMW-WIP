            /** Handles input in the global search bar */
            function handleGlobalSearchInput(e) {
                currentSearchTerm = sanitizeString(e.target.value);
                // If the current section is archive, re-filter the table
                if (activeSection === 'archive') {
                    filterAndRenderArchiveTable(currentSearchTerm);
                }
                // If on another section, nothing happens on input unless the user navigates to archive.
            }


             /** Handles clicks anywhere in the document (delegation) */
            function handleDocumentClick(e) {
                // Table Action Buttons
                const editButton = e.target.closest('.edit-btn');
                if (editButton && editButton.dataset.phone) {
                    showEditModal(editButton.dataset.phone);
                    return; // Prevent other actions
                }
                const removeButton = e.target.closest('.remove-btn');
                if (removeButton && removeButton.dataset.phone) {
                    deleteCustomer(removeButton.dataset.phone);
                    return; // Prevent other actions
                }

                // Section Triggers (e.g., buttons inside cards)
                const sectionTrigger = e.target.closest('[data-section]:not(.nav-link)'); // Exclude nav links themselves
                if (sectionTrigger) {
                    const sectionId = sectionTrigger.dataset.section;
                    const targetNavLink = document.querySelector(`.nav-link[data-section="${sectionId}"]`);
                    targetNavLink?.click(); // Simulate click on the corresponding nav link
                    return; // Prevent other actions
                }

                // Section-specific buttons (delegated from sectionButtonsContainer)
                // This is now handled by the specific event listener added in setupSectionEventListeners for archive
                // const sectionButton = e.target.closest('#scan-duplicates-btn');
                //  if (sectionButton) {
                //      // Delegate to the specific handler
                //      handleSectionButtonClick(e); // This is no longer needed due to direct listener
                //      return; // Prevent other actions
                //  }
            }


            /** Handles closing the app */
            function handleCloseApp() {
                // Use custom confirm for consistency, though native confirm is fine too
                showCustomConfirm('هل أنت متأكد أنك تريد إغلاق التطبيق؟ سيتم حفظ البيانات.', (confirmed) => {
                    if (confirmed) {
                        saveData(); // Ensure data is saved
                        window.close(); // Attempt to close the window/tab
                    }
                });
            }

             /** Handles Enter/Esc keydown in modals */
            function handleModalKeydown(e) {
                if (e.key === 'Enter') {
                    // Prevent default form submission if inside a form
                    if (e.target.form) {
                         e.preventDefault();
                    }

                    // Trigger OK/Save action based on which modal is active
                    if (this.id === 'edit-modal') {
                         this.querySelector('#save-edited-customer')?.click();
                    } else if (this.id === 'custom-confirm-modal') {
                        DOMElements.confirmOkBtn?.click();
                    } else if (this.id === 'duplicate-resolution-modal') {
                         DOMElements.duplicateResolutionSaveBtn?.click();
                    }
                    // Add prompt modal handling if needed
                } else if (e.key === 'Escape') {
                    e.preventDefault();
                    // Trigger Cancel action
                     if (this.id === 'edit-modal') {
                         this.querySelector('#cancel-edit')?.click();
                    } else if (this.id === 'custom-confirm-modal') {
                        DOMElements.confirmCancelBtn?.click();
                    } else if (this.id === 'duplicate-resolution-modal') {
                         hideDuplicateResolutionModal(); // Escape cancels the duplicate resolution
                    }
                     // Add prompt modal handling if needed
                }
            }

             /** Handles OK click in custom confirm modal */
            function handleConfirmOk() {
                if (DOMElements.confirmModal?._callback) {
                    DOMElements.confirmModal._callback(true); // Execute stored callback
                }
                hideCustomConfirm();
            }

            /** Handles Cancel click in custom confirm modal */
            function handleConfirmCancel() {
                 if (DOMElements.confirmModal?._callback) {
                    DOMElements.confirmModal._callback(false); // Execute stored callback
                }
                hideCustomConfirm();
            }

            /** Handles clicks on sortable table headers (Delegated) */
            function handleSortClickDelegated(e) {
                const th = e.target.closest('th[data-sort-key]'); // Only target sortable headers
                if (!th) return; // Not a sortable header

                const sortKey = th.dataset.sortKey;
                const currentSortOrder = th.dataset.sortOrder || 'desc'; // Default to descending (newest first)

                // Determine next sort order
                const nextSortOrder = currentSortOrder === 'desc' ? 'asc' : 'desc';

                // Update global sort state
                currentSort = { key: sortKey, order: nextSortOrder };

                // Re-render the archive table with the new sort order
                filterAndRenderArchiveTable(currentSearchTerm);
            }

            /** Scans for duplicate phone numbers with different names and initiates resolution */
            function scanForDuplicates() {
                const phoneGroups = {}; // Group records by phone number
                const duplicatesToResolve = []; // Array to store phone numbers with different names

                // Group data by sanitized phone number
                allData.forEach(item => {
                    const cleanPhone = sanitizePhone(item.phone);
                    if (cleanPhone) {
                        if (!phoneGroups[cleanPhone]) {
                            phoneGroups[cleanPhone] = {
                                phone: cleanPhone,
                                names: new Set(), // Use a Set to store unique names
                                records: [] // Store all records for this phone
                            };
                        }
                        phoneGroups[cleanPhone].names.add(sanitizeString(item.name));
                        phoneGroups[cleanPhone].records.push(item);
                    }
                });

                // Identify phone numbers with more than one unique name
                Object.values(phoneGroups).forEach(group => {
                    if (group.names.size > 1) {
                        duplicatesToResolve.push(group);
                    }
                });

                if (duplicatesToResolve.length > 0) {
                    // For simplicity, resolve one duplicate group at a time
                    const duplicateGroup = duplicatesToResolve[0];
                    const namesArray = Array.from(duplicateGroup.names);

                    showDuplicateResolutionModal(duplicateGroup.phone, namesArray, (selectedName) => {
                        if (selectedName) {
                            // Update all records for this phone with the selected name
                            allData = allData.map(item => {
                                if (sanitizePhone(item.phone) === duplicateGroup.phone) {
                                    return { ...item, name: selectedName };
                                }
                                return item;
                            });
                            // Update currentData as well if needed (though not strictly necessary for archive view)
                            currentData = currentData.map(item => {
                                if (sanitizePhone(item.phone) === duplicateGroup.phone) {
                                    return { ...item, name: selectedName };
                                }
                                return item;
                            });

                            saveData();
                            showNotification(`تم تحديث جميع سجلات ${duplicateGroup.phone} بالاسم "${selectedName}".`, 'success');
                            // Re-run scan to find the next duplicate group if any
                            scanForDuplicates();
                        } else {
                            // User cancelled resolution for this group
                            showNotification(`تم إلغاء حل تكرار الاسم لرقم ${duplicateGroup.phone}.`, 'info');
                            // Continue scanning for the next duplicate group
                            // Remove the current group from the list and process the next
                             duplicatesToResolve.shift(); // Remove the first item
                             if (duplicatesToResolve.length > 0) {
                                 const nextGroup = duplicatesToResolve[0];
                                 const nextNames = Array.from(nextGroup.names);
                                 // Use a small timeout to allow the modal to close before opening the next one
                                 setTimeout(() => {
                                     showDuplicateResolutionModal(nextGroup.phone, nextNames, duplicateResolutionCallback); // Pass the same callback structure
                                 }, 300); // Adjust timeout as needed
                             } else {
                                 // No more duplicates to resolve
                                 showNotification('اكتمل فحص التكرارات.', 'success');
                                 // Refresh the archive table to show changes if any
                                 if (activeSection === 'archive') {
                                     filterAndRenderArchiveTable(currentSearchTerm);
                                 }
                             }
                        }
                         // Refresh the archive table after resolution (or cancellation)
                         if (activeSection === 'archive') {
                             filterAndRenderArchiveTable(currentSearchTerm);
                         }
                    });

                } else {
                    showNotification('لم يتم العثور على أي أرقام هواتف مكررة بأسماء مختلفة.', 'success');
                }
            }

            /** Handles the save action in the duplicate resolution modal */
            function handleDuplicateResolutionSave() {
                 if (!currentDuplicatePhone || !duplicateResolutionCallback || !DOMElements.duplicateNamesList) return;

                 const selectedRadio = DOMElements.duplicateNamesList.querySelector('input[name="duplicate-name"]:checked');

                 if (selectedRadio) {
                     const selectedName = sanitizeString(selectedRadio.value);
                     duplicateResolutionCallback(selectedName); // Pass the selected name to the callback
                     hideDuplicateResolutionModal(); // Hide the modal after saving
                 } else {
                     // Show an error if no name is selected
                     if (DOMElements.duplicateResolutionError) {
                         DOMElements.duplicateResolutionError.textContent = 'يرجى اختيار اسم للاحتفاظ به.';
                         DOMElements.duplicateResolutionError.style.display = 'block';
                     }
                 }
             }


            /** Sets up or updates the global keyboard listener */
            function setupKeyListener() {
                if (currentKeyListener) {
                    document.removeEventListener('keydown', currentKeyListener);
                }

                currentKeyListener = (e) => {
                    const activeElement = document.activeElement;
                    const isInputFocused = activeElement.tagName === 'INPUT' || activeElement.tagName === 'TEXTAREA';
                    // Check if ANY modal is currently open and visible
                    const isModalOpen = !!document.querySelector('.modal.show');

                    // Prevent shortcuts if input is focused or modal is open
                    if (isInputFocused || isModalOpen) return;

                    const key = e.key.toLowerCase();

                    if (key === settings.collectKey) {
                        e.preventDefault();
                        collectData();
                    } else if (key === settings.searchKey) {
                        e.preventDefault();
                        // Focus the global search input in the header
                        DOMElements.globalSearchInput?.focus();
                    } else if (key === settings.editLastKey) {
                        e.preventDefault();
                        if (currentData.length > 0) {
                            showEditModal(currentData[currentData.length - 1].phone);
                        } else {
                            showNotification('لا توجد بيانات مجمعة حديثاً للتعديل.', 'info');
                        }
                    }
                };

                document.addEventListener('keydown', currentKeyListener);
            }

            /** Gets the localized title for a section */
            function getSectionTitle(sectionId) {
                const titles = {
                    'main': 'الرئيسية', 'collect': 'جمع البيانات',
                    'archive': 'الأرشيف', 'settings': 'الإعدادات'
                };
                return titles[sectionId] || 'غير معروف';
            }


            // --- Public API ---
            function init() {
                cacheDOMElements(); // Cache elements on init
                loadDataAndSettings();
                applyTheme();
                setupGlobalEventListeners();
                renderSection(activeSection || 'main'); // Render initial section
                // Add initial body class for entry animation (optional)
                // document.body.classList.add('loaded');
            }

            return {
                init // Expose only the init function
            };
        })();

        // --- Initialize the App ---
        document.addEventListener('DOMContentLoaded', app.init);

    </script>
</body>
