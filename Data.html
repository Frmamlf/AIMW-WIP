<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUST BEKARY</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.19.3/package/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        /* --- Theme Variables --- */
        :root {
            --primary-color: #6c5ce7; /* Purple */
            --secondary-color: #fd79a8; /* Pink */
            --accent-color: #00cec9; /* Cyan */
            --dark-color: #2d3436; /* Dark Gray */
            --light-color: #f8f9fa; /* Light Gray */
            --success-color: #00b894; /* Teal Green */
            --warning-color: #fdcb6e; /* Yellow */
            --danger-color: #d63030; /* Red */
            --text-color: #2d3436; /* Dark text */
            --bg-color: #f5f7fa; /* Light background */
            --card-bg: #ffffff; /* White card background */
            --sidebar-bg: linear-gradient(180deg, var(--primary-color), var(--secondary-color)); /* Custom gradient sidebar */
            --sidebar-text: #ffffff; /* White sidebar text */
            --sidebar-active: rgba(255, 255, 255, 0.2); /* White translucent for active sidebar */
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.1); /* Standard shadow */
            --transition-speed: 0.3s; /* Consistent transition speed */
            --transition-func: cubic-bezier(0.4, 0, 0.2, 1); /* Smoother easing */
            --border-color: rgba(0, 0, 0, 0.08); /* Light border */
        }

        /* --- Base Styles --- */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
             font-family: 'Rubik', 'Arial', sans-serif;
             line-height: 1.6;
             min-height: 100vh;
             background-color: var(--bg-color);
             color: var(--text-color);
             overflow-x: hidden; /* Prevent horizontal scroll */
        }

        /* --- Layout --- */
        .app-container {
            display: flex;
            min-height: 100vh;
            position: relative;
            overflow: hidden; /* Keep overflow hidden */
        }

        .sidebar {
            width: 280px;
            background: var(--sidebar-bg);
            color: var(--sidebar-text);
            padding: 20px 0;
            box-shadow: 2px 0 15px rgba(0,0,0,0.1);
            position: relative;
            z-index: 10;
            border-left: 1px solid var(--border-color);
            flex-shrink: 0; /* Prevent sidebar from shrinking */
            transition: transform var(--transition-speed) var(--transition-func); /* Add transition for potential future use (e.g., mobile toggle) */
        }

        .main-content {
            flex: 1;
            padding: 30px;
            position: relative;
            overflow-y: auto; /* Allow content scrolling if needed */
        }

        /* --- Background Effects --- */
        .light-effect {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.3;
            z-index: -1; /* Behind content */
        }
        .light-1 { background: var(--accent-color); top: -100px; right: -100px; }
        .light-2 { background: var(--success-color); bottom: -100px; left: -100px; }

        /* --- Sidebar Elements --- */
        .logo {
            text-align: center;
            padding: 20px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
        }
        .logo h1 { font-size: 24px; color: var(--sidebar-text); margin-bottom: 5px; position: relative; font-weight: 700; }
        .logo p { font-size: 12px; color: rgba(255,255,255,0.7); }
        .glow-text { text-shadow: 0 0 10px rgba(253, 121, 167, 0.5); }

        .nav-menu { list-style: none; padding: 0 15px; }
        .nav-item {
            margin-bottom: 5px;
            position: relative;
            overflow: hidden;
            border-radius: 999px; /* Pill shape */
            transition: background-color var(--transition-speed) var(--transition-func);
        }
        .nav-link {
            display: flex;
            align-items: center;
            padding: 14px 20px;
            color: var(--sidebar-text);
            text-decoration: none;
            border-right: 3px solid transparent;
            position: relative;
            z-index: 1;
            opacity: 0.8;
            font-weight: 500;
            transition: background-color var(--transition-speed) var(--transition-func),
                        color var(--transition-speed) var(--transition-func),
                        opacity var(--transition-speed) var(--transition-func),
                        transform var(--transition-speed) var(--transition-func),
                        border-color var(--transition-speed) var(--transition-func);
        }
        .nav-link:hover, .nav-link.active {
            background: var(--sidebar-active);
            color: var(--sidebar-text);
            border-right-color: var(--accent-color);
            transform: translateX(-5px);
            opacity: 1;
        }
        .nav-link i { margin-left: 10px; font-size: 18px; }

        /* --- Header Elements --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 15px;
        }
         /* Added container for title and section buttons */
        .header-title-area {
            display: flex;
            align-items: center;
            gap: 15px; /* Space between title and buttons */
            flex-wrap: wrap; /* Allow wrapping on small screens */
        }
        .header h2 {
            color: var(--primary-color);
            font-size: 28px;
            position: relative;
            display: inline-block;
            font-weight: 700;
        }
        .header h2::after {
            content: '';
            position: absolute;
            bottom: -10px;
            right: 0;
            width: 50px;
            height: 3px;
            background: var(--secondary-color);
            border-radius: 3px;
        }
        .global-search {
            display: flex;
            align-items: center;
            background: var(--card-bg);
            border-radius: 999px;
            padding: 5px 15px;
            box-shadow: var(--shadow);
            flex-grow: 1;
            max-width: 300px;
            border: 1px solid var(--border-color);
            transition: box-shadow var(--transition-speed) var(--transition-func), border-color var(--transition-speed) var(--transition-func);
        }
         .global-search:focus-within {
             border-color: var(--primary-color);
             box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.2);
         }
        .global-search input[type="text"] {
            border: none;
            outline: none;
            background: transparent;
            padding: 8px 0;
            font-size: 16px;
            color: var(--text-color);
            flex-grow: 1;
            width: 100%;
        }
        .global-search i { color: var(--text-color); opacity: 0.6; margin-left: 10px; }

        .close-btn {
            background: var(--danger-color);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%; /* Circular */
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(214, 48, 49, 0.3);
            flex-shrink: 0;
            transition: transform var(--transition-speed) var(--transition-func), box-shadow var(--transition-speed) var(--transition-func);
        }
        .close-btn:hover {
            transform: rotate(90deg) scale(1.1);
            box-shadow: 0 6px 20px rgba(214, 48, 49, 0.4);
        }

        /* --- Buttons --- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 24px;
            border: none;
            border-radius: 999px; /* Pill shape */
            font-weight: 700;
            cursor: pointer;
            margin: 5px;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: transform var(--transition-speed) var(--transition-func),
                        box-shadow var(--transition-speed) var(--transition-func),
                        background-color var(--transition-speed) var(--transition-func),
                        color var(--transition-speed) var(--transition-func);
            -webkit-tap-highlight-color: transparent; /* Remove tap highlight on mobile */
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }
        .btn:active { transform: translateY(1px); }
        .btn i { margin-left: 8px; }
        .btn-primary { background: var(--primary-color); color: white; box-shadow: 0 4px 15px rgba(108, 92, 231, 0.3); }
        .btn-primary:hover { box-shadow: 0 8px 25px rgba(108, 92, 231, 0.4); }
        .btn-success { background: var(--success-color); color: white; box-shadow: 0 4px 15px rgba(0, 184, 148, 0.3); }
        .btn-success:hover { box-shadow: 0 8px 25px rgba(0, 184, 148, 0.4); }
        .btn-danger { background: var(--danger-color); color: white; box-shadow: 0 4px 15px rgba(214, 48, 49, 0.3); }
        .btn-danger:hover { box-shadow: 0 6px 20px rgba(214, 48, 49, 0.4); }
        .btn-warning { background: var(--warning-color); color: #333; box-shadow: 0 4px 15px rgba(253, 203, 110, 0.3); }
        .btn-warning:hover { box-shadow: 0 8px 25px rgba(253, 203, 110, 0.4); }
        .btn-outline { background: transparent; border: 2px solid var(--primary-color); color: var(--primary-color); box-shadow: none; }
        .btn-outline:hover { background: var(--primary-color); color: white; box-shadow: 0 8px 25px rgba(108, 92, 231, 0.4); }

        /* --- Cards --- */
        .card {
            background: var(--card-bg);
            border-radius: 24px; /* Softer rounding */
            box-shadow: var(--shadow);
            padding: 25px;
            margin-bottom: 25px;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: box-shadow var(--transition-speed) var(--transition-func);
        }
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: var(--card-bg);
            border-radius: 24px; /* Softer rounding */
            padding: 25px;
            box-shadow: var(--shadow);
            text-align: center;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: transform var(--transition-speed) var(--transition-func), box-shadow var(--transition-speed) var(--transition-func);
        }
        .stat-card::after {
            content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 4px;
            background: var(--secondary-color); border-radius: 0 0 4px 4px;
            transition: height var(--transition-speed) var(--transition-func);
        }
        .stat-card:hover { transform: translateY(-10px); box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
        .stat-card:hover::after { height: 8px; }
        .stat-card h3 { font-size: 14px; color: var(--text-color); margin-bottom: 15px; opacity: 0.8; font-weight: 700; }
        .stat-card p { font-size: 32px; font-weight: 700; color: var(--primary-color); margin: 10px 0; }

        /* --- Tables --- */
        .table-container {
            overflow-x: auto;
            margin-bottom: 20px;
            border-radius: 16px; /* Moderate rounding */
            box-shadow: var(--shadow);
            background: var(--card-bg);
            border: 1px solid var(--border-color);
        }
        table.data-table { /* Be more specific */
            width: 100%;
            border-collapse: collapse;
            overflow: hidden;
        }
        .data-table th, .data-table td {
            padding: 15px 20px;
            text-align: right;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap; /* Prevent wrapping in table cells */
        }
        .data-table th {
            background: rgba(0,0,0,0.02);
            font-weight: 700;
            color: var(--primary-color);
            position: sticky;
            top: 0;
            z-index: 1; /* Ensure header stays above scrolling content */
        }
         /* Style for sortable header */
         .data-table th[data-sort-key] {
             cursor: pointer; /* Indicate sortable */
         }
         .data-table th[data-sort-key]:hover {
             background: rgba(0,0,0,0.05);
         }
         .data-table th[data-sort-order] {
             color: var(--secondary-color); /* Highlight sorted column header */
         }

        .data-table td { font-weight: 500; }
        .data-table tr:hover td { background: rgba(0,0,0,0.03); }
        .data-table tr:last-child td { border-bottom: none; }
        .action-buttons { display: flex; gap: 5px; }
        .edit-btn, .remove-btn {
            border: none; border-radius: 999px; padding: 5px 10px; cursor: pointer;
            font-size: 14px; display: inline-flex; align-items: center; font-weight: 500;
            transition: opacity var(--transition-speed) var(--transition-func), transform var(--transition-speed) var(--transition-func);
        }
        .edit-btn { background: var(--primary-color); color: white; }
        .remove-btn { background: var(--danger-color); color: white; }
        .edit-btn:hover, .remove-btn:hover { opacity: 0.8; transform: scale(1.05); }
        .edit-btn i, .remove-btn i { margin-left: 5px; }

        /* --- Forms & Inputs --- */
        .form-group { margin-bottom: 25px; }
        label { display: block; margin-bottom: 10px; font-weight: 700; color: var(--text-color); }
        input[type="text"], input[type="password"], input[type="number"], select, .settings-input /* Add class for consistency */ {
            width: 100%;
            padding: 12px 18px;
            border: 1px solid var(--border-color);
            border-radius: 999px; /* Pill shape */
            font-size: 16px;
            background: var(--card-bg);
            color: var(--text-color);
            font-weight: 500;
            transition: border-color var(--transition-speed) var(--transition-func), box-shadow var(--transition-speed) var(--transition-func);
        }
        input[type="text"]:focus, input[type="password"]:focus, input[type="number"]:focus, select:focus, .settings-input:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.2);
        }
        .checkbox-group { display: flex; align-items: center; cursor: pointer; }
        .checkbox-group input[type="checkbox"] {
             appearance: none; width: 20px; height: 20px; border: 2px solid var(--primary-color);
             border-radius: 4px; /* Subtle rounding */ margin-left: 10px; position: relative; cursor: pointer;
             transition: background-color 0.2s, border-color 0.2s; flex-shrink: 0;
        }
        .checkbox-group input[type="checkbox"]::after {
             content: ''; position: absolute; top: 3px; left: 3px; width: 10px; height: 10px;
             background-color: var(--primary-color); border-radius: 2px; opacity: 0; transition: opacity 0.2s;
        }
        .checkbox-group input[type="checkbox"]:checked { background-color: var(--primary-color); border-color: var(--primary-color); }
        .checkbox-group input[type="checkbox"]:checked::after { opacity: 1; }
        .checkbox-group label { margin-bottom: 0; cursor: pointer; font-weight: 500; }
        .file-input { display: none; }
        /* Accessibility helper */
        .sr-only {
            position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
            overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border-width: 0;
        }


        /* --- Modals --- */
        .modal {
            display: none; /* Initially hidden */
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6); /* Slightly darker backdrop */
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
            opacity: 0; /* Start transparent */
            transition: opacity var(--transition-speed) var(--transition-func);
             /* will-change: opacity; */ /* Consider if performance issues arise */
        }
        .modal.show { /* Class to trigger display and fade-in */
            display: flex;
            opacity: 1;
        }
        .modal-content {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 24px; /* Softer rounding */
            width: 90%;
            max-width: 500px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
            transform: scale(0.95); /* Start slightly smaller */
            opacity: 0; /* Start transparent */
            transition: transform var(--transition-speed) var(--transition-func), opacity var(--transition-speed) var(--transition-func);
            /* will-change: transform, opacity; */ /* Consider if performance issues arise */
        }
        .modal.show .modal-content { /* Animate content when modal is shown */
            transform: scale(1);
            opacity: 1;
        }
        .custom-prompt-modal .modal-content,
        .custom-confirm-modal .modal-content,
        .duplicate-resolution-modal .modal-content /* Apply to new modal */ { text-align: center; }
        .custom-prompt-modal input[type="text"] { margin-top: 15px; margin-bottom: 20px; }
        .modal-buttons { display: flex; justify-content: center; gap: 10px; margin-top: 20px; }

        /* Styles specific to the duplicate resolution modal */
        .duplicate-resolution-modal .name-list {
            list-style: none;
            padding: 0;
            margin: 20px 0;
            text-align: left; /* Align text to the right for RTL */
            direction: rtl;
        }
        .duplicate-resolution-modal .name-item {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: background-color 0.2s ease, border-color 0.2s ease;
            display: flex;
            align-items: center;
        }
         .duplicate-resolution-modal .name-item:hover {
             background-color: rgba(0,0,0,0.03);
             border-color: var(--primary-color);
         }
        .duplicate-resolution-modal .name-item input[type="radio"] {
            margin-left: 10px; /* Space between radio and text */
            margin-right: 0; /* Remove default left margin */
            flex-shrink: 0; /* Prevent shrinking */
        }
         .duplicate-resolution-modal .name-item label {
             margin-bottom: 0;
             cursor: pointer;
             flex-grow: 1; /* Allow label to take available space */
             font-weight: normal; /* Less bold than form labels */
         }


        /* --- Notifications --- */
        .notification {
            position: fixed; bottom: 30px; right: 30px;
            background: var(--success-color); color: white;
            padding: 15px 25px; /* Slightly adjusted padding */
            border-radius: 999px; /* Pill shape */
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            z-index: 1001; /* Above modals if needed */
            display: flex; align-items: center;
            font-weight: 500;
            opacity: 0;
            transform: translateY(20px); /* Start slightly lower */
            transition: opacity var(--transition-speed) var(--transition-func), transform var(--transition-speed) var(--transition-func);
            /* will-change: transform, opacity; */ /* Consider if performance issues arise */
        }
        .notification.show { /* Class to trigger fade-in and slide-up */
            opacity: 1;
            transform: translateY(0);
        }
        .notification.hide { /* Class to trigger fade-out and slide-down */
            opacity: 0;
            transform: translateY(20px);
        }
        .notification.error { background: var(--danger-color); }
        .notification.info { background: var(--accent-color); }
         .notification.warning { background: var(--warning-color); color: #333; } /* Warning notification style */
        .notification i { margin-left: 8px; } /* Keep icon spacing */

        /* --- Animations & Effects --- */
        @keyframes fadeInContent { /* Renamed for clarity */
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
             /* Use a shorter, snappier fade for content */
            animation: fadeInContent 0.4s var(--transition-func) forwards;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); } /* Slightly subtler float */
        }
        .float { animation: float 4s ease-in-out infinite; }

        /* --- Settings Specific --- */
        .theme-switch { display: flex; align-items: center; margin-bottom: 25px; cursor: pointer; }
        .theme-switch input[type="checkbox"] {
            appearance: none; width: 52px; height: 32px; background-color: var(--text-color);
            border-radius: 999px; position: relative; cursor: pointer; outline: none;
            margin-left: 12px; transition: background-color 0.3s ease; flex-shrink: 0;
        }
        .theme-switch input[type="checkbox"]::before {
             content: ''; position: absolute; width: 28px; height: 28px; background-color: var(--bg-color);
             border-radius: 50%; top: 2px; left: 2px; transition: transform 0.3s ease, background-color 0.3s ease;
        }
        .theme-switch input[type="checkbox"]:checked { background-color: var(--primary-color); }
        .theme-switch input[type="checkbox"]:checked::before { transform: translateX(20px); background-color: var(--card-bg); }
        .theme-switch label { margin-bottom: 0; cursor: pointer; font-weight: 500; }
        .color-picker-group { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; flex-wrap: wrap; }
        .color-picker-group label { margin-bottom: 0; flex-shrink: 0; font-weight: 500; }
        .color-picker-group input[type="color"] {
            appearance: none; -moz-appearance: none; -webkit-appearance: none;
            width: 40px; height: 40px; background: none; border: none; padding: 0; cursor: pointer;
            border-radius: 999px; overflow: hidden;
        }
        .color-picker-group input[type="color"]::-webkit-color-swatch { border-radius: 999px; border: 1px solid var(--border-color); }
        .color-picker-group input[type="color"]::-moz-color-swatch { border-radius: 999px; border: 1px solid var(--border-color); }
        .alert {
            padding: 15px 20px; border-radius: 999px; margin-bottom: 25px; display: none;
            box-shadow: var(--shadow); font-weight: 500;
        }
        .alert-success { background: rgba(0, 184, 148, 0.1); color: var(--success-color); border: 1px solid rgba(0, 184, 148, 0.2); }
        .alert-danger { background: rgba(214, 48, 49, 0.1); color: var(--danger-color); border: 1px solid rgba(214, 48, 49, 0.2); }

        /* --- Responsive --- */
        @media (max-width: 768px) {
            .sidebar {
                /* Example: Hide sidebar off-screen initially on mobile */
                /* position: fixed; transform: translateX(100%); */
                /* Add a button to toggle it */
            }
            .main-content { padding: 20px; } /* Reduce padding */
            .header { flex-direction: column; align-items: flex-start; }
             .global-search { width: 100%; max-width: none; margin-top: 15px; } /* Make global search full width on mobile */
            .close-btn { margin-top: 15px; }
            .stats-container { grid-template-columns: 1fr; } /* Stack stat cards */
             .modal-content { width: 95%; } /* Slightly wider modal on small screens */
        }

    </style>
</head>
<body>
    <div class="light-effect light-1"></div>
    <div class="light-effect light-2"></div>

    <div class="app-container">
        <div class="sidebar">
            <div class="logo">
                <h1 class="glow-text">JUST BEKARY</h1>
                <p>أداة إدارة بيانات العملاء</p>
            </div>
            <nav> <ul class="nav-menu">
                    <li class="nav-item">
                        <a href="#" class="nav-link active" data-section="main">
                            <i class="fas fa-home"></i> الرئيسية
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link" data-section="collect">
                            <i class="fas fa-plus-circle"></i> جمع البيانات
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link" data-section="archive">
                            <i class="fas fa-archive"></i> الأرشيف
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link" data-section="settings">
                            <i class="fas fa-cog"></i> الإعدادات
                        </a>
                    </li>
                </ul>
            </nav>
        </div>

        <div class="main-content">
            <header class="header">
                <div class="header-title-area">
                    <h2 id="section-title">الرئيسية</h2>
                    <div id="section-buttons"></div>
                </div>
                <div class="global-search">
                    <label for="global-search-input" class="sr-only">بحث شامل</label>
                    <input type="text" id="global-search-input" placeholder="ابحث عن عميل...">
                    <i class="fas fa-search"></i>
                </div>
                <button class="close-btn" title="إغلاق التطبيق">
                    <i class="fas fa-times"></i>
                </button>
            </header>
            <main id="content-area">
                </main>
        </div>
    </div>

    <div class="modal custom-prompt-modal" id="custom-prompt-modal" role="dialog" aria-modal="true" aria-labelledby="custom-prompt-message">
        <div class="modal-content">
            <p id="custom-prompt-message"></p>
            <input type="text" id="custom-prompt-input" class="settings-input">
            <div class="modal-buttons">
                <button class="btn btn-outline" id="custom-prompt-cancel">إلغاء</button>
                <button class="btn btn-primary" id="custom-prompt-ok">موافق</button>
            </div>
        </div>
    </div>

    <div class="modal custom-confirm-modal" id="custom-confirm-modal" role="dialog" aria-modal="true" aria-labelledby="custom-confirm-message">
        <div class="modal-content">
            <p id="custom-confirm-message"></p>
            <div class="modal-buttons">
                <button class="btn btn-outline" id="custom-confirm-cancel">إلغاء</button>
                <button class="btn btn-danger" id="custom-confirm-ok">تأكيد</button>
            </div>
        </div>
    </div>

    <div class="modal edit-modal" id="edit-modal" role="dialog" aria-modal="true" aria-labelledby="edit-modal-title">
        <div class="modal-content">
            <h3 id="edit-modal-title" style="margin-bottom: 20px;">تعديل بيانات العميل</h3>
            <div class="form-group">
                <label for="edit-name">الاسم:</label>
                <input type="text" id="edit-name" class="settings-input">
            </div>
            <div class="form-group">
                <label for="edit-phone">رقم الهاتف:</label>
                <input type="text" id="edit-phone" class="settings-input">
            </div>
            <div class="form-group">
                <label for="edit-orders-count">عدد الطلبات:</label>
                <input type="number" id="edit-orders-count" class="settings-input" min="1">
            </div>
            <p id="edit-error" style="color: var(--danger-color); margin-top: 5px; display: none;" role="alert"></p>
            <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
                <button class="btn btn-outline" id="cancel-edit">إلغاء</button>
                <button class="btn btn-primary" id="save-edited-customer">حفظ التغييرات</button>
            </div>
        </div>
    </div>

    <div class="modal duplicate-resolution-modal" id="duplicate-resolution-modal" role="dialog" aria-modal="true" aria-labelledby="duplicate-resolution-title">
        <div class="modal-content">
            <h3 id="duplicate-resolution-title" style="margin-bottom: 20px;">حل تكرار بيانات العميل</h3>
            <p>تم العثور على رقم الهاتف <strong id="duplicate-phone-display"></strong> مرتبط بأسماء مختلفة. يرجى اختيار الاسم الذي تريد الاحتفاظ به لجميع سجلات هذا الرقم:</p>
            <ul class="name-list" id="duplicate-names-list">
                </ul>
            <p id="duplicate-resolution-error" style="color: var(--danger-color); margin-top: 5px; display: none;" role="alert"></p>
            <div class="modal-buttons">
                <button class="btn btn-outline" id="duplicate-resolution-cancel">إلغاء</button>
                <button class="btn btn-primary" id="duplicate-resolution-save">الاحتفاظ بالاسم المحدد</button>
            </div>
        </div>
    </div>
    <div id="notification-container" aria-live="assertive"></div>


    <script>
        // --- Configuration ---
        const CONFIG = {
            localStorageKeys: {
                data: 'bekaryData',
                settings: 'bekarySettings'
            },
            defaultSettings: {
                collectKey: 'a',
                searchKey: 's', // This key is now used for focusing the header search
                editLastKey: 'e',
                primaryColor: '#6c5ce7',
                secondaryColor: '#fd79a8'
            },
            debounceDelay: 100, // Reduced debounce delay for faster perceived search
            notificationTimeout: 5000 // Increased notification timeout slightly
        };

        // --- Application Module ---
        const app = (() => {
            // --- State ---
            let currentData = []; // Data collected in the current session
            let allData = []; // All data loaded from storage
            let settings = {}; // App settings
            let currentKeyListener = null;
            let editingCustomerPhone = null;
            let currentSearchTerm = '';
            let activeSection = 'main'; // Track the currently displayed section
            let currentSort = { key: 'lastOrder', order: 'desc' }; // Default sort key is 'lastOrder'
            // State for duplicate resolution
            let currentDuplicatePhone = null; // Phone number being resolved
            let duplicateResolutionCallback = null; // Callback for resolution modal

            // --- Cached DOM Elements ---
            const DOMElements = {}; // Cache for frequently used elements

            // --- Utility Functions ---
            const debounce = (func, delay) => {
                let timeoutId;
                return (...args) => {
                    clearTimeout(timeoutId);
                    timeoutId = setTimeout(() => func.apply(this, args), delay);
                };
            };

            const sanitizeString = (str) => str ? String(str).trim() : '';
            const sanitizePhone = (phone) => sanitizeString(phone).replace(/\s+/g, ''); // Remove spaces from phone

             /** Formats a date string to locale date and time */
             const formatDateTime = (isoString) => {
                 if (!isoString) return 'غير محدد';
                 try {
                     const date = new Date(isoString);
                      if (isNaN(date.getTime())) return 'تاريخ غير صالح';
                     // Use 'ar-EG' locale for Arabic formatting, specify options for time
                     return date.toLocaleDateString('ar-EG') + ' ' + date.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
                 } catch (e) {
                     console.error("Invalid date for formatting:", isoString, e);
                     return 'خطأ في التاريخ';
                 }
             };


            // --- DOM Manipulation & Rendering ---

            /** Caches essential DOM elements */
            function cacheDOMElements() {
                DOMElements.sidebar = document.querySelector('.sidebar');
                DOMElements.contentArea = document.getElementById('content-area');
                DOMElements.sectionTitle = document.getElementById('section-title');
                DOMElements.globalSearchInput = document.getElementById('global-search-input');
                DOMElements.navLinks = document.querySelectorAll('.nav-link');
                DOMElements.sectionButtonsContainer = document.getElementById('section-buttons'); // Cache the new container
                // Modals
                DOMElements.editModal = document.getElementById('edit-modal');
                DOMElements.editNameInput = document.getElementById('edit-name');
                DOMElements.editPhoneInput = document.getElementById('edit-phone');
                DOMElements.editOrdersInput = document.getElementById('edit-orders-count');
                DOMElements.editError = document.getElementById('edit-error');
                DOMElements.confirmModal = document.getElementById('custom-confirm-modal');
                DOMElements.confirmMessage = document.getElementById('custom-confirm-message');
                DOMElements.confirmOkBtn = document.getElementById('custom-confirm-ok');
                DOMElements.confirmCancelBtn = document.getElementById('custom-confirm-cancel');
                // New Duplicate Resolution Modal
                DOMElements.duplicateResolutionModal = document.getElementById('duplicate-resolution-modal');
                DOMElements.duplicatePhoneDisplay = document.getElementById('duplicate-phone-display');
                DOMElements.duplicateNamesList = document.getElementById('duplicate-names-list');
                DOMElements.duplicateResolutionError = document.getElementById('duplicate-resolution-error');
                DOMElements.duplicateResolutionSaveBtn = document.getElementById('duplicate-resolution-save');
                DOMElements.duplicateResolutionCancelBtn = document.getElementById('duplicate-resolution-cancel');

                // Notification container (optional, could create on demand)
                DOMElements.notificationContainer = document.getElementById('notification-container');
            }

            /** Applies theme colors from settings */
            function applyTheme() {
                const rootStyle = document.documentElement.style;
                rootStyle.setProperty('--primary-color', settings.primaryColor);
                rootStyle.setProperty('--secondary-color', settings.secondaryColor);
                // Future: Could add logic for dark/light mode toggle here
            }

            /** Generates HTML for the main dashboard section */
            function getMainContentHTML() {
                const uniqueCustomers = new Set(allData.map(item => item.phone)).size;
                const totalOrders = allData.reduce((sum, item) => sum + (item.ordersCount || 1), 0);
                const avgOrders = uniqueCustomers > 0 ? (totalOrders / uniqueCustomers).toFixed(1) : 0;

                return `
                    <div class="stats-container">
                        <div class="stat-card"><h3>البيانات الحالية (الجلسة)</h3><p>${currentData.length}</p></div>
                        <div class="stat-card"><h3>إجمالي الطلبات</h3><p>${totalOrders}</p></div>
                        <div class="stat-card"><h3>العملاء الفريدون</h3><p>${uniqueCustomers}</p></div>
                        <div class="stat-card"><h3>متوسط الطلبات لكل عميل</h3><p>${avgOrders}</p></div>
                    </div>
                    <div class="card">
                        <h3 style="margin-bottom: 15px;">بدء الاستخدام</h3>
                        <p style="margin-bottom: 20px;">مرحبًا بك في أداة JUST BEKARY لإدارة بيانات العملاء</p>
                        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                            <button class="btn btn-primary" data-section="collect"><i class="fas fa-plus-circle"></i> جمع بيانات جديدة</button>
                        </div>
                    </div>`;
            }

            /** Generates HTML for the data collection section */
            function getCollectContentHTML() {
                const lastCollectedTable = currentData.length > 0
                    ? `<div class="card">
                           <h3 style="margin-bottom: 15px;">آخر البيانات المجمعة</h3>
                           <div class="table-container">${generateTableHTML(currentData.slice().reverse(), false)}</div> </div>`
                    : '';

                return `
                    <div class="card">
                        <h3 style="margin-bottom: 15px;">جمع بيانات جديدة</h3>
                        <p style="margin-bottom: 10px;">استخدم الزر أدناه أو اضغط على المفتاح <strong>${settings.collectKey.toUpperCase()}</strong> لجمع بيانات جديدة.</p>
                        <p style="margin-bottom: 20px;">اضغط على المفتاح <strong>${settings.editLastKey.toUpperCase()}</strong> لتعديل آخر بيانات تم جمعها.</p>
                        <button id="collect-btn" class="btn btn-primary float" style="padding: 15px 30px; font-size: 18px;">
                            <i class="fas fa-plus-circle"></i> جمع البيانات
                        </button>
                    </div>
                    ${lastCollectedTable}`;
            }

            /** Generates HTML for the archive section */
            function getArchiveContentHTML(searchTerm = '') {
                const filteredData = getFilteredData(searchTerm);
                const tableContent = filteredData.length > 0
                    ? generateTableHTML(filteredData, true) // Pass true to make header sortable
                    : getEmptyTableMessageHTML(searchTerm);

                const actionButtons = allData.length > 0 ? `
                    <div style="margin-top: 20px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px;">
                        <button id="delete-all" class="btn btn-danger"><i class="fas fa-trash-alt"></i> حذف جميع البيانات</button>
                        <div>
                            <button id="export-excel" class="btn btn-success"><i class="fas fa-file-excel"></i> تصدير إلى Excel</button>
                            <input type="file" id="import-excel-file" class="file-input" accept=".xlsx, .xls">
                            <button id="import-excel-btn" class="btn btn-primary"><i class="fas fa-file-import"></i> استيراد من Excel</button>
                        </div>
                    </div>` : '';

                return `
                    <div class="card">
                        <h3 style="margin-bottom: 15px;">الأرشيف الكامل</h3>
                        <div class="table-container" id="archive-table-container">${tableContent}</div>
                        ${actionButtons}
                    </div>`;
            }

             /** Generates HTML for the settings section */
            function getSettingsContentHTML() {
                return `
                    <div class="card">
                        <h3 style="margin-bottom: 20px;">إعدادات التطبيق</h3>

                        <div class="form-group">
                            <label>اختيار ألوان الثيم:</label>
                            <div class="color-picker-group">
                                <label for="primary-color-picker">اللون الأساسي:</label>
                                <input type="color" id="primary-color-picker" value="${settings.primaryColor}">
                            </div>
                            <div class="color-picker-group">
                                <label for="secondary-color-picker">اللون الثانوي:</label>
                                <input type="color" id="secondary-color-picker" value="${settings.secondaryColor}">
                            </div>
                            <button id="save-color-settings" class="btn btn-primary" style="margin-top: 10px;"><i class="fas fa-palette"></i> حفظ ألوان الثيم</button>
                        </div>

                        <hr style="border: none; border-top: 1px solid var(--border-color); margin: 30px 0;">

                        <div class="form-group">
                            <label for="collect-key">مفتاح جمع البيانات:</label>
                            <input type="text" id="collect-key" value="${settings.collectKey}" maxlength="1" class="settings-input">
                            <small style="display: block; margin-top: 5px; color: var(--text-color); opacity: 0.7;">أدخل حرفًا أو رقمًا واحدًا.</small>
                        </div>
                        <div class="form-group">
                            <label for="search-key">مفتاح بدء البحث:</label>
                            <input type="text" id="search-key" value="${settings.searchKey}" maxlength="1" class="settings-input">
                            <small style="display: block; margin-top: 5px; color: var(--text-color); opacity: 0.7;">أدخل حرفًا أو رقمًا واحدًا.</small>
                        </div>
                        <div class="form-group">
                            <label for="edit-last-key">مفتاح تعديل آخر بيانات:</label>
                            <input type="text" id="edit-last-key" value="${settings.editLastKey}" maxlength="1" class="settings-input">
                            <small style="display: block; margin-top: 5px; color: var(--text-color); opacity: 0.7;">أدخل حرفًا أو رقمًا واحدًا.</small>
                        </div>

                        <div id="settings-message" class="alert alert-success" style="display: none;" role="alert"></div>

                        <button id="save-key-settings" class="btn btn-primary"><i class="fas fa-save"></i> حفظ مفاتيح الاختصار</button>
                    </div>`;
            }

            /** Generates HTML for the data table */
            function generateTableHTML(data, isSortable = false) {
                // Summarize data to get the latest entry for each phone number
                const summary = data.reduce((acc, item) => {
                    const phoneString = sanitizePhone(item.phone);
                    if (!acc[phoneString] || new Date(item.lastOrder || 0) >= new Date(acc[phoneString].lastOrder || 0)) {
                        acc[phoneString] = { ...item, phone: phoneString }; // Ensure phone is sanitized
                    }
                    return acc;
                }, {});

                // Apply current sort order to the summarized data
                const sortedData = Object.values(summary).sort((a, b) => {
                    const dateA = new Date(a[currentSort.key] || 0);
                    const dateB = new Date(b[currentSort.key] || 0);

                    if (currentSort.key === 'lastOrder') {
                         if (currentSort.order === 'asc') {
                             return dateA - dateB; // Oldest first
                         } else {
                             return dateB - dateA; // Newest first (default)
                         }
                    } else {
                         // Handle other potential sort keys if added later
                         return 0; // No sorting for other keys currently
                    }
                });


                let tableRows = '';
                sortedData.forEach((item, index) => {
                    const formattedDateTime = formatDateTime(item.lastOrder);

                    tableRows += `
                        <tr>
                            <td>${index + 1}</td>
                            <td>${sanitizeString(item.name)}</td>
                            <td>${item.phone}</td>
                            <td>${item.ordersCount || 1}</td>
                            <td>${formattedDateTime}</td>
                            <td>
                                <div class="action-buttons">
                                    <button class="edit-btn" data-phone="${item.phone}" title="تعديل"><i class="fas fa-edit"></i> تعديل</button>
                                    <button class="remove-btn" data-phone="${item.phone}" title="حذف"><i class="fas fa-trash-alt"></i> حذف</button>
                                </div>
                            </td>
                        </tr>`;
                });

                // Determine header for the time column based on sortability
                const timeHeader = isSortable
                    ? `<th data-sort-key="lastOrder" data-sort-order="${currentSort.order}">وقت الاضافة ${currentSort.order === 'asc' ? '&#9650;' : '&#9660;'}</th>`
                    : `<th>وقت الاضافة</th>`;


                return `
                    <table class="data-table">
                        <thead>
                            <tr><th>#</th><th>الاسم</th><th>رقم الهاتف</th><th>عدد الطلبات</th>${timeHeader}<th>إجراءات</th></tr>
                        </thead>
                        <tbody>${tableRows}</tbody>
                    </table>`;
            }

            /** Generates HTML for the empty table message */
            function getEmptyTableMessageHTML(searchTerm = '') {
                const message = searchTerm
                    ? `لا توجد بيانات مطابقة لـ "${searchTerm}"`
                    : 'لا توجد بيانات في الأرشيف حتى الآن';
                return `
                    <p style="text-align: center; padding: 30px; color: var(--text-color); opacity: 0.7;">
                        <i class="fas fa-inbox" style="font-size: 50px; margin-bottom: 15px; display: block;"></i>${message}
                    </p>`;
            }

            /** Renders a specific section in the content area */
            function renderSection(sectionId, searchTerm = '') {
                activeSection = sectionId; // Update active section tracker
                if (!DOMElements.contentArea || !DOMElements.sectionTitle || !DOMElements.sectionButtonsContainer) return; // Guard clause

                // Update title
                DOMElements.sectionTitle.textContent = getSectionTitle(sectionId);

                // Clear previous section-specific buttons
                DOMElements.sectionButtonsContainer.innerHTML = '';

                // Add section-specific buttons
                if (sectionId === 'archive') {
                    const scanButton = document.createElement('button');
                    scanButton.id = 'scan-duplicates-btn';
                    scanButton.className = 'btn btn-warning'; // Use a suitable button style
                    scanButton.innerHTML = '<i class="fas fa-search"></i> فحص التكرارات'; // Use a relevant icon
                    DOMElements.sectionButtonsContainer.appendChild(scanButton);
                }

                // Generate content based on section
                let contentHTML = '';
                switch (sectionId) {
                    case 'main':    contentHTML = getMainContentHTML(); break;
                    case 'collect': contentHTML = getCollectContentHTML(); break;
                    case 'archive': contentHTML = getArchiveContentHTML(searchTerm); break;
                    case 'settings':contentHTML = getSettingsContentHTML(); break;
                    default:        contentHTML = '<p>القسم غير معروف</p>';
                }

                // Update DOM and trigger animation
                DOMElements.contentArea.innerHTML = contentHTML;
                DOMElements.contentArea.classList.remove('fade-in');
                void DOMElements.contentArea.offsetWidth; // Force reflow
                DOMElements.contentArea.classList.add('fade-in');

                // Update active nav link
                DOMElements.navLinks.forEach(link => {
                    link.classList.toggle('active', link.dataset.section === sectionId);
                });

                // Setup event listeners specific to the newly rendered section
                setupSectionEventListeners(sectionId);

                 // If showing archive and there's a search term, filter the table
                 if (sectionId === 'archive' && currentSearchTerm) {
                     filterAndRenderArchiveTable(currentSearchTerm);
                 }
            }

            /** Filters archive data based on search term and applies current sort */
            function getFilteredData(searchTerm = '') {
                const term = sanitizeString(searchTerm).toLowerCase();
                const dataToFilter = allData; // Use the main data source

                let filtered = dataToFilter;

                if (term) {
                    // Filter by name or phone if a search term exists
                    filtered = dataToFilter.filter(item =>
                        (item.name && sanitizeString(item.name).toLowerCase().includes(term)) ||
                        (item.phone && sanitizePhone(item.phone).includes(term)) // Search sanitized phone
                    );
                }

                // Summarize filtered data to get the latest entry for each phone number
                 const summary = filtered.reduce((acc, item) => {
                     const phoneString = sanitizePhone(item.phone);
                     if (!acc[phoneString] || new Date(item.lastOrder || 0) >= new Date(acc[phoneString].lastOrder || 0)) {
                         acc[phoneString] = { ...item, phone: phoneString };
                     }
                     return acc;
                 }, {});


                // Apply current sort order to the summarized data
                const sortedData = Object.values(summary).sort((a, b) => {
                    const dateA = new Date(a[currentSort.key] || 0);
                    const dateB = new Date(b[currentSort.key] || 0);

                    if (currentSort.key === 'lastOrder') {
                        if (currentSort.order === 'asc') {
                            return dateA - dateB; // Oldest first
                        } else {
                            return dateB - dateA; // Newest first (default)
                        }
                    } else {
                        // Handle other potential sort keys if added later
                        return 0; // No sorting for other keys currently
                    }
                });

                return sortedData;
            }

            /** Filters and re-renders the archive table */
            function filterAndRenderArchiveTable(searchTerm) {
                const filtered = getFilteredData(searchTerm);
                const tableContainer = document.getElementById('archive-table-container'); // Re-select as it might be re-rendered
                if (tableContainer) {
                     // Pass true to generateTableHTML to make the header sortable
                    tableContainer.innerHTML = filtered.length > 0
                        ? generateTableHTML(filtered, true)
                        : getEmptyTableMessageHTML(searchTerm);

                     // Re-attach sort listener after rendering the table
                     const lastOrderHeader = document.querySelector('#archive-table-container th[data-sort-key="lastOrder"]');
                     if(lastOrderHeader) {
                         lastOrderHeader.removeEventListener('click', handleSortClickDelegated); // Remove old listener
                         lastOrderHeader.addEventListener('click', handleSortClickDelegated); // Add new listener
                     }
                }
            }

            /** Displays a notification message */
            function showNotification(message, type = 'success') {
                if (!DOMElements.notificationContainer) { // Create container if needed
                     DOMElements.notificationContainer = document.createElement('div');
                     DOMElements.notificationContainer.id = 'notification-container';
                     DOMElements.notificationContainer.setAttribute('aria-live', 'assertive');
                     document.body.appendChild(DOMElements.notificationContainer);
                }

                // Remove existing notification first
                const existingNotification = DOMElements.notificationContainer.querySelector('.notification');
                if (existingNotification) {
                    existingNotification.remove();
                }

                const notification = document.createElement('div');
                let iconClass;
                if (type === 'error') {
                    iconClass = 'fa-exclamation-circle';
                } else if (type === 'info') {
                    iconClass = 'fa-info-circle';
                } else if (type === 'warning') {
                     iconClass = 'fa-exclamation-triangle'; // Use warning icon
                }
                else {
                    iconClass = 'fa-check-circle';
                }

                notification.className = `notification ${type}`; // Add type class directly
                notification.innerHTML = `<i class="fas ${iconClass}"></i>&nbsp; ${message}`;
                notification.setAttribute('role', 'alert');

                DOMElements.notificationContainer.appendChild(notification);

                // Trigger fade-in animation
                requestAnimationFrame(() => {
                    notification.classList.add('show');
                });


                // Set timeout to hide and remove
                setTimeout(() => {
                    notification.classList.remove('show');
                    notification.classList.add('hide');
                    // Remove the element after the fade-out transition completes
                    notification.addEventListener('transitionend', () => notification.remove(), { once: true });
                }, CONFIG.notificationTimeout);
            }

            /** Shows a modal */
            function showModal(modalElement) {
                if (modalElement) {
                     modalElement.style.display = 'flex'; // Use display:flex to show
                     // Trigger opacity/transform transition
                     requestAnimationFrame(() => {
                        modalElement.classList.add('show');
                     });
                }
            }

            /** Hides a modal */
            function hideModal(modalElement) {
                if (modalElement) {
                    modalElement.classList.remove('show');
                    // Wait for transition to finish before setting display: none
                    modalElement.addEventListener('transitionend', () => {
                         // Only hide if the class is still removed (prevents race conditions)
                         if (!modalElement.classList.contains('show')) {
                            modalElement.style.display = 'none';
                         }
                    }, { once: true });
                }
            }

            /** Shows the custom confirmation modal */
            function showCustomConfirm(message, callback) {
                if (DOMElements.confirmModal && DOMElements.confirmMessage) {
                    DOMElements.confirmMessage.textContent = message;
                    showModal(DOMElements.confirmModal);
                    // Store callback directly on the element for simplicity here
                    DOMElements.confirmModal._callback = callback;
                     // Focus the OK button for accessibility and Enter key press
                    if (DOMElements.confirmOkBtn) DOMElements.confirmOkBtn.focus();
                }
            }

            /** Hides the custom confirmation modal */
            function hideCustomConfirm() {
                if (DOMElements.confirmModal) {
                    hideModal(DOMElements.confirmModal);
                    DOMElements.confirmModal._callback = null; // Clear callback
                }
            }

            /** Shows the edit customer modal */
            function showEditModal(phone) {
                const cleanPhone = sanitizePhone(phone);
                let customerToEdit = null;
                // Find the latest existing record for this customer to pre-fill the form
                for (let i = allData.length - 1; i >= 0; i--) {
                    if (sanitizePhone(allData[i].phone) === cleanPhone) {

            // --- Data Handling ---

            /** Loads data and settings from localStorage */
            function loadDataAndSettings() {
                try {
                    const savedData = localStorage.getItem(CONFIG.localStorageKeys.data);
                    allData = savedData ? JSON.parse(savedData) : [];
                    // Basic validation (ensure it's an array)
                    if (!Array.isArray(allData)) allData = [];
                } catch (e) {
                    console.error("Error loading data from localStorage:", e);
                    allData = []; // Reset to empty array on error
                }

                try {
                    const savedSettings = localStorage.getItem(CONFIG.localStorageKeys.settings);
                    const parsedSettings = savedSettings ? JSON.parse(savedSettings) : {};
                    // Merge defaults with saved settings
                    settings = { ...CONFIG.defaultSettings, ...parsedSettings };
                     // Ensure no legacy settings persist if they were removed from defaults
                     Object.keys(settings).forEach(key => {
                         if (!(key in CONFIG.defaultSettings)) {
                             delete settings[key];
                         }
                     });

                } catch (e) {
                    console.error("Error loading settings from localStorage:", e);
                    settings = { ...CONFIG.defaultSettings }; // Reset to defaults on error
                }
            }

            /** Saves data and settings to localStorage */
            function saveData() {
                try {
                    // Only save relevant settings defined in defaultSettings
                    const settingsToSave = {};
                    Object.keys(CONFIG.defaultSettings).forEach(key => {
                        if (key in settings) {
                            settingsToSave[key] = settings[key];
                        }
                    });
                    localStorage.setItem(CONFIG.localStorageKeys.settings, JSON.stringify(settingsToSave));
                    localStorage.setItem(CONFIG.localStorageKeys.data, JSON.stringify(allData));
                } catch (e) {
                    console.error("Error saving to localStorage:", e);
                    showNotification('خطأ أثناء حفظ البيانات! قد تكون المساحة ممتلئة.', 'error');
                }
            }

             /** Handles the data collection process */
            function collectData() {
                // Use native prompts for simplicity as before
                const name = prompt('أدخل اسم العميل:');
                if (name === null) return; // User cancelled
                const cleanName = sanitizeString(name);
                if (!cleanName) {
                    showNotification('يجب إدخال اسم العميل', 'error');
                    return;
                }

                const phone = prompt('أدخل رقم الهاتف:');
                if (phone === null) return; // User cancelled
                const cleanPhone = sanitizePhone(phone); // Sanitize for comparison and storage
                if (!cleanPhone) {
                    showNotification('يجب إدخال رقم الهاتف', 'error');
                    return;
                }

                // Find the latest existing record for this phone to get the current order count
                let latestOrderCount = 0;
                let customerExists = false;
                // Iterate backwards to find the most recent entry for this phone
                for (let i = allData.length - 1; i >= 0; i--) {
                    if (sanitizePhone(allData[i].phone) === cleanPhone) {
                        latestOrderCount = allData[i].ordersCount || 0;
                        customerExists = true;
                        break; // Found the latest, exit loop
                    }
                }

                // Create the new record
                const now = new Date().toISOString();
                const newRecord = {
                    name: cleanName,
                    phone: cleanPhone, // Store sanitized phone
                    ordersCount: latestOrderCount + 1,
                    lastOrder: now // Use 'lastOrder' to store the timestamp of this collection
                };

                // Add to data arrays
                allData.push(newRecord);
                currentData.push({ ...newRecord }); // Add a copy to current session data

                saveData();
                showNotification(`تم ${customerExists ? 'تحديث طلب' : 'إضافة'} العميل ${cleanName} (إجمالي الطلبات: ${newRecord.ordersCount})`, 'success');

                // Refresh the current section if needed
                if (activeSection === 'collect') {
                    renderSection('collect');
                } else if (activeSection === 'main') {
                    renderSection('main'); // Refresh main to update stats
                } else if (activeSection === 'archive') {
                     // If in archive, re-render to include the new entry and maintain current filter/sort
                     filterAndRenderArchiveTable(currentSearchTerm);
                }
            }

            /** Saves edited customer data */
            function saveEditedCustomer() {
                if (!editingCustomerPhone || !DOMElements.editModal) return; // Should not happen if modal is shown correctly

                const newName = sanitizeString(DOMElements.editNameInput?.value);
                const newPhoneRaw = DOMElements.editPhoneInput?.value; // Keep raw for potential display issues
                const newPhoneClean = sanitizePhone(newPhoneRaw); // Sanitize for logic/storage
                const newOrdersCountRaw = DOMElements.editOrdersInput?.value;
                const newOrdersCount = parseInt(newOrdersCountRaw, 10);

                // --- Validation ---
                if (!newName || !newPhoneClean) {
                    if (DOMElements.editError) { DOMElements.editError.textContent = 'الاسم ورقم الهاتف مطلوبان.'; DOMElements.editError.style.display = 'block'; }
                    return;
                }
                if (isNaN(newOrdersCount) || newOrdersCount < 1) {
                    if (DOMElements.editError) { DOMElements.editError.textContent = 'عدد الطلبات يجب أن يكون رقماً صحيحاً أكبر من 0.'; DOMElements.editError.style.display = 'block'; }
                    return;
                }
                // Check for duplicate phone *only if it changed*
                if (newPhoneClean !== editingCustomerPhone) {
                    const duplicateExists = allData.some(item => sanitizePhone(item.phone) === newPhoneClean);
                    if (duplicateExists) {
                        if (DOMElements.editError) { DOMElements.editError.textContent = 'رقم الهاتف الجديد مسجل بالفعل.'; DOMElements.editError.style.display = 'block'; }
                        return;
                    }
                }
                // --- End Validation ---


                let updated = false;
                const now = new Date().toISOString();
                // Update all records matching the original phone number
                allData = allData.map(item => {
                    if (sanitizePhone(item.phone) === editingCustomerPhone) {
                        updated = true;
                        return {
                            ...item, // Preserve original lastOrder for each record if needed
                            name: newName,
                            phone: newPhoneClean, // Store sanitized phone
                            ordersCount: newOrdersCount, // Apply the new count from the modal
                            // Decide whether to update lastOrder on edit.
                            // For simplicity, keeping the original 'lastOrder' of each record.
                            // If you want editing to count as a new "addition time", uncomment the line below:
                            // lastOrder: now
                        };
                    }
                    return item;
                });

                // Update currentData as well
                 currentData = currentData.map(item => {
                     if (sanitizePhone(item.phone) === editingCustomerPhone) {
                         return { ...item, name: newName, phone: newPhoneClean, ordersCount: newOrdersCount };
                     }
                     return item;
                 });


                if (updated) {
                    saveData();
                    hideEditModal();
                    showNotification('تم تعديل بيانات العميل بنجاح!', 'success');
                    // Refresh the current section to show changes
                    renderSection(activeSection, activeSection === 'archive' ? currentSearchTerm : '');
                } else {
                    // Should not happen if modal was opened correctly
                    showNotification('خطأ: لم يتم العثور على العميل الأصلي للتعديل.', 'error');
                    hideEditModal();
                }
            }

            /** Deletes all records for a customer */
            function deleteCustomer(phone) {
                const cleanPhone = sanitizePhone(phone);
                showCustomConfirm(`هل أنت متأكد أنك تريد حذف العميل وكل طلباته برقم الهاتف ${cleanPhone}؟`, (confirmed) => {
                    if (confirmed) {
                        const initialLength = allData.length;
                        allData = allData.filter(item => sanitizePhone(item.phone) !== cleanPhone);
                        currentData = currentData.filter(item => sanitizePhone(item.phone) !== cleanPhone);

                        if (allData.length < initialLength) {
                            saveData();
                            showNotification(`تم حذف العميل ${cleanPhone} وكل طلباته.`, 'success');
                            renderSection(activeSection, activeSection === 'archive' ? currentSearchTerm : '');
                        } else {
                            showNotification(`خطأ: لم يتم العثور على العميل ${cleanPhone}.`, 'error');
                        }
                    } else {
                        showNotification('تم إلغاء الحذف.', 'info');
                    }
                });
            }

            /** Exports data to Excel */
            function exportToExcel() {
                // Summarize data for export (latest entry per phone number)
                const summary = allData.reduce((acc, item) => {
                     const phoneString = sanitizePhone(item.phone);
                     if (!acc[phoneString] || new Date(item.lastOrder || 0) >= new Date(acc[phoneString].lastOrder || 0)) {
                         acc[phoneString] = { ...item, phone: phoneString };
                     }
                     return acc;
                 }, {});
                const dataToExport = Object.values(summary);

                if (dataToExport.length === 0) {
                    showNotification('لا توجد بيانات للتصدير!', 'info');
                    return;
                }

                try {
                    const exportSheetData = dataToExport.map(item => ({
                        'الاسم': sanitizeString(item.name),
                        'رقم الهاتف': item.phone, // Export sanitized phone
                        'عدد الطلبات': item.ordersCount || 1,
                        'وقت الاضافة': item.lastOrder ? new Date(item.lastOrder) : null // Export as Date object
                    }));

                    const ws = XLSX.utils.json_to_sheet(exportSheetData);

                    // Apply date formatting and column widths
                    const range = XLSX.utils.decode_range(ws['!ref']);
                    // Assuming 'وقت الاضافة' is the 5th column (index 4)
                    const timeColumnIndex = 4;
                    for(let R = range.s.r + 1; R <= range.e.r; ++R) {
                        const cell_address = XLSX.utils.encode_cell({c:timeColumnIndex, r:R});
                        if(ws[cell_address] && ws[cell_address].v instanceof Date) {
                            ws[cell_address].t = 'd';
                            // Use a format that includes date and time
                            ws[cell_address].z = 'yyyy-mm-dd hh:mm AM/PM'; // Example format
                        }
                    }
                    // Adjust column widths as needed
                    ws['!cols'] = [ {wch:25}, {wch:20}, {wch:15}, {wch:25}, {wch:15} ]; // Added width for new column

                    const wb = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wb, ws, "بيانات العملاء");
                    XLSX.writeFile(wb, `بيانات_just_bekary_${new Date().toISOString().slice(0,10)}.xlsx`);

                    showNotification('تم تصدير البيانات بنجاح!', 'success');
                } catch (error) {
                    console.error('Error exporting to Excel:', error);
                    showNotification('حدث خطأ أثناء تصدير البيانات.', 'error');
                }
            }

            /** Imports data from Excel */
            function importFromExcel(file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array', cellDates: true }); // Enable cellDates
                        const firstSheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[firstSheetName];
                        const json = XLSX.utils.sheet_to_json(worksheet, { defval: null });

                        let importedCount = 0, updatedCount = 0, skippedCount = 0;
                        const importedPhones = new Set(); // Avoid duplicates within the file

                        json.forEach(row => {
                            const rowKeys = Object.keys(row).reduce((acc, key) => { acc[key.trim()] = row[key]; return acc; }, {}); // Use trim() on keys

                            const name = sanitizeString(rowKeys['الاسم'] || rowKeys['الاسم']); // Check for both keys if needed
                            const phone = sanitizePhone(rowKeys['رقم الهاتف'] || rowKeys['رقم الهاتف']); // Sanitize phone immediately
                            let ordersCount = 1;
                            if (rowKeys['عدد الطلبات'] !== null && !isNaN(parseInt(rowKeys['عدد الطلبات'], 10))) {
                                ordersCount = Math.max(1, parseInt(rowKeys['عدد الطلبات'], 10));
                            }
                            let lastOrder = new Date(); // Default to now
                            // Check for 'وقت الاضافة' or original 'آخر طلب' key
                            const dateKey = rowKeys['وقت الاضافة'] ? 'وقت الاضافة' : (rowKeys['آخر طلب'] ? 'آخر طلب' : null);

                            if (dateKey && rowKeys[dateKey] instanceof Date && !isNaN(rowKeys[dateKey].getTime())) {
                                 lastOrder = rowKeys[dateKey];
                            } else if (dateKey && typeof rowKeys[dateKey] === 'number') { // Handle Excel date numbers
                                 const excelDate = XLSX.SSF.parse_date_code(rowKeys[dateKey]);
                                 if(excelDate) {
                                     lastOrder = new Date(Date.UTC(excelDate.y, excelDate.m-1, excelDate.d, excelDate.H || 0, excelDate.M || 0, excelDate.S || 0));
                                 }
                            }
                            const lastOrderISO = lastOrder.toISOString(); // Store as ISO string

                            if (name && phone) {
                                if (importedPhones.has(phone)) {
                                    skippedCount++; return; // Skip duplicate within file
                                }

                                const existingIndex = allData.findIndex(item => sanitizePhone(item.phone) === phone);
                                const importRecord = { name, phone, ordersCount, lastOrder: lastOrderISO };

                                if (existingIndex !== -1) {
                                    // Update: Replace existing record(s) with this single imported record
                                    allData = allData.filter(item => sanitizePhone(item.phone) !== phone); // Remove old
                                    allData.push(importRecord); // Add new
                                    updatedCount++;
                                } else {
                                    allData.push(importRecord);
                                    importedCount++;
                                }
                                importedPhones.add(phone);
                            } else {
                                skippedCount++;
                            }
                        });

                        saveData();
                        showNotification(`تم الاستيراد! ${importedCount} جديد، ${updatedCount} محدّث، ${skippedCount} متخطى.`, 'success');
                        renderSection('archive', currentSearchTerm); // Refresh view

                    } catch (error) {
                        console.error('Error processing Excel file:', error);
                        showNotification('حدث خطأ أثناء معالجة ملف Excel.', 'error');
                    }
                };
                reader.onerror = (error) => {
                    console.error('Error reading file:', error);
                    showNotification('حدث خطأ أثناء قراءة الملف.', 'error');
                };
                reader.readAsArrayBuffer(file);
            }

             /** Handles clicks on navigation links */
            function handleNavClick(e) {

                if (navLink && navLink.dataset.section) {
                    e.preventDefault();
                    const sectionId = navLink.dataset.section;
                    if (sectionId !== activeSection) { // Only render if section changed
                         // When navigating to archive, ensure global search term is applied
                         if (sectionId === 'archive') {
                             renderSection(sectionId, currentSearchTerm);
                         } else {

                             if (activeSection === 'archive') {
